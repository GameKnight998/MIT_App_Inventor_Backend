services:
  - type: web
    name: image-locator-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin the interpreter to match local development.
      - key: PYTHON_VERSION
        value: 3.13.2
      # Set the real key in the Render dashboard (sync: false keeps it secret).
      - key: OPENAI_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gpt-4o
      - key: GEOCODING_ENABLED
        value: "1"
      - key: GEOCODER_USER_AGENT
        value: ImageLocatorBackend/1.0 (MIT App Inventor capstone)
      - key: VERIFY_ENABLED
        value: "1"
      - key: VERIFY_RADIUS_M
        value: "3000"
      - key: VERIFY_TIMEOUT
        value: "15"
      - key: OVERPASS_CONNECT_TIMEOUT
        value: "6"
      - key: OVERPASS_TOTAL_BUDGET
        value: "25"
      - key: OVERPASS_COOLDOWN
        value: "120"
      - key: MAX_VERIFY_ATTEMPTS
        value: "5"
      - key: GEO_CANDIDATES_PER_NAME
        value: "3"
      - key: ENRICH_ENABLED
        value: "1"
      - key: CLUSTER_RADIUS_KM
        value: "150"
      - key: NARROW_ENABLED
        value: "1"
      - key: MAX_NARROW_STEPS
        value: "3"
      - key: NARROW_MIN_RADIUS_M
        value: "500"
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: CACHE_MAX_ENTRIES
        value: "2048"
      - key: PARALLEL_WORKERS
        value: "6"
      - key: ELEVATION_ENABLED
        value: "1"
      - key: CLIMATE_ENABLED
        value: "1"
      - key: GEOENV_TIMEOUT
        value: "8"
      - key: VIDEO_ENABLED
        value: "1"
      - key: MAX_VIDEO_BYTES
        value: "62914560"
      - key: VIDEO_MAX_FRAMES
        value: "5"
      - key: VIDEO_MAX_SCAN
        value: "40"
      - key: VIDEO_MIN_BLUR
        value: "40"
      - key: VIDEO_FRAME_DIFF_MIN
        value: "8"
      - key: LANDMARK_VERIFY_ENABLED
        value: "1"
      - key: LANDMARK_PLACE_MATCH_KM
        value: "50"
      - key: LANDMARK_WATER_SEARCH_KM
        value: "25"
      - key: LANDMARK_MATCH_KM
        value: "40"
