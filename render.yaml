services:
  - type: web
    name: image-locator-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin the interpreter to match local development.
      - key: PYTHON_VERSION
        value: 3.13.2
      # Set the real keys in the Render dashboard (sync: false keeps them secret).
      - key: OPENAI_API_KEY
        sync: false
      # Only needed when VISION_PROVIDER=anthropic.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VISION_PROVIDER
        value: openai
      - key: VISION_MODEL
        value: gpt-4o
      - key: VISION_TIMEOUT
        value: "60"
      - key: VISION_MAX_TOKENS
        value: "2000"
      - key: SCENE_ROUTING_ENABLED
        value: "1"
      # Image enhancement runs on OpenCV, already installed for video.
      - key: ENHANCE_ENABLED
        value: "1"
      - key: ENHANCE_MIN_DIM
        value: "800"
      - key: ENHANCE_MAX_DIM
        value: "2048"
      - key: ENHANCE_DARK_MEAN
        value: "70"
      - key: ENHANCE_BLUR_MIN
        value: "60"
      # Denoising and Real-ESRGAN are too slow / too heavy for the free tier.
      - key: ENHANCE_DENOISE
        value: "0"
      - key: REALESRGAN_ENABLED
        value: "0"
      - key: STREET_REFINE_ENABLED
        value: "1"
      - key: STREET_REFINE_RADIUS_KM
        value: "25"
      - key: STREET_REFINE_MAX_QUERIES
        value: "4"
      - key: PHOTON_ENABLED
        value: "1"
      - key: VEHICLE_ID_ENABLED
        value: "1"
      - key: VEHICLE_DETECT_ENABLED
        value: "1"
      # Optional: without a Roboflow key the whole image is analysed instead.
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: SYNTHETIC_DETECTION_ENABLED
        value: "1"
      - key: SYNTHETIC_AI_THRESHOLD
        value: "0.8"
      # Model-based detection needs torch (~2.5 GB); it does not fit this plan.
      - key: SYNTHETIC_MODEL_ENABLED
        value: "0"
      # NOTE: the free-tier disk is ephemeral, so cases are wiped on each deploy.
      # Attach a disk and point CASE_DB_PATH at it for durable cases.
      - key: CASE_ENABLED
        value: "1"
      - key: CASE_MAX_IMAGES
        value: "6"
      - key: CASE_PARALLEL_IMAGES
        value: "2"
      - key: CASE_CLUSTER_RADIUS_KM
        value: "10"
      - key: GEOCODING_ENABLED
        value: "1"
      - key: GEOCODER_USER_AGENT
        value: ImageLocatorBackend/1.0 (MIT App Inventor capstone)
      - key: VERIFY_ENABLED
        value: "1"
      - key: VERIFY_RADIUS_M
        value: "3000"
      - key: VERIFY_TIMEOUT
        value: "15"
      - key: OVERPASS_CONNECT_TIMEOUT
        value: "6"
      - key: OVERPASS_TOTAL_BUDGET
        value: "25"
      - key: OVERPASS_COOLDOWN
        value: "120"
      - key: MAX_VERIFY_ATTEMPTS
        value: "5"
      - key: GEO_CANDIDATES_PER_NAME
        value: "3"
      - key: ENRICH_ENABLED
        value: "1"
      - key: CLUSTER_RADIUS_KM
        value: "150"
      - key: NARROW_ENABLED
        value: "1"
      - key: MAX_NARROW_STEPS
        value: "3"
      - key: NARROW_MIN_RADIUS_M
        value: "500"
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: CACHE_MAX_ENTRIES
        value: "2048"
      - key: PARALLEL_WORKERS
        value: "6"
      - key: ELEVATION_ENABLED
        value: "1"
      - key: CLIMATE_ENABLED
        value: "1"
      - key: GEOENV_TIMEOUT
        value: "8"
      - key: VIDEO_ENABLED
        value: "1"
      - key: MAX_VIDEO_BYTES
        value: "62914560"
      - key: VIDEO_MAX_FRAMES
        value: "5"
      - key: VIDEO_MAX_SCAN
        value: "40"
      - key: VIDEO_MIN_BLUR
        value: "40"
      - key: VIDEO_FRAME_DIFF_MIN
        value: "8"
      - key: LANDMARK_VERIFY_ENABLED
        value: "1"
      - key: LANDMARK_PLACE_MATCH_KM
        value: "50"
      - key: LANDMARK_WATER_SEARCH_KM
        value: "25"
      - key: LANDMARK_MATCH_KM
        value: "40"
      - key: DEFINED_RADIUS_KM
        value: "2"
